name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Proyek belum menyertakan Gradle wrapper; setup-gradle memasang versi yang dipakai AGP 8.5.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Tes unit dan APK debug
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Unggah APK debug
        uses: actions/upload-artifact@v4
        with:
          name: droidscp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Unggah laporan tes bila gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
